# Clippy thresholds and disallowed-lists for the strict lint policy. Lint
# *levels* live in the `[workspace.lints]` table in the workspace
# `Cargo.toml`, which member crates adopt via `lints.workspace = true`; this
# file only configures the lints themselves.
#
# No `msrv` key: clippy reads the pinned `rust-version` (the MSRV) from the
# workspace `Cargo.toml` automatically.

# ── Quality-of-life gates ───────────────────────────────────────────────────
avoid-breaking-exported-api      = false
allow-unwrap-in-tests            = false
allow-expect-in-tests            = false
allow-panic-in-tests             = false
allow-dbg-in-tests               = false
allow-print-in-tests             = false
allow-indexing-slicing-in-tests  = false
allow-useless-vec-in-tests       = false

# ── Complexity / size thresholds ────────────────────────────────────────────
cognitive-complexity-threshold   = 20
excessive-nesting-threshold      = 4
too-many-arguments-threshold     = 7
too-many-lines-threshold         = 90
type-complexity-threshold        = 160
enum-variant-size-threshold      = 200
enum-variant-name-threshold      = 3
large-error-threshold            = 128
pass-by-value-size-limit         = 16
single-char-binding-names-threshold = 3
trivial-copy-size-limit          = 16
verbose-bit-mask-threshold       = 1
array-size-threshold             = 512000
stack-size-threshold             = 512000
future-size-threshold            = 8192
literal-representation-threshold = 10
max-fn-params-bools              = 2
max-struct-bools                 = 2
max-include-file-size            = 1000000
max-suggested-slice-pattern-length = 3
max-trait-bounds                 = 3
vec-box-size-threshold           = 4096
unnecessary-box-size             = 128

# ── Name allow-list ─────────────────────────────────────────────────────────
allowed-idents-below-min-chars = [
    "x", "y", "z", "i", "j", "n", "f",
]

# ── Doc identifier allow-list (extends, does NOT replace, clippy defaults) ──
# `clippy::doc_markdown` flags un-backticked identifiers in docs. The `..`
# token splices in clippy's built-in list (GitHub, OAuth, …); project-specific
# idents are prepended before `..`.
doc-valid-idents = ["QuickCheck", ".."]

# ── Blocked placeholder names ───────────────────────────────────────────────
disallowed-names = [
    "foo", "bar", "baz", "tmp", "temp",
    "data", "val", "thing", "stuff", "date",
    "todo", "fixme", "xxx", "test", "qux",
    "info", "value", "item", "price", "amount",
]

# ── Disallowed macros (debug artefacts, panicking assertions, legacy property
#    harness front doors) ─────────────────────────────────────────────────────
# Assertion macros panic. No test exemption: tests return
# `Result<(), strict_test_support::TestFailure>` and use the `ensure*`
# helpers (`ensure`, `ensure_eq`, `ensure_ne`, …).
#
# Property tests go through `proptest::strict::ensure_property`, the native
# strict property runner: it returns `Result<(), TestFailure>` and still
# shrinks failures, without panicking. The legacy macro front doors below
# either panic or bypass the `TestFailure` vocabulary. The non-panicking
# strategy constructors (`prop_oneof!`, `prop_compose!`) remain allowed. The
# external `strict_test_support::ensure_property` wrapper is the deferred
# legacy path, not the destination.
disallowed-macros = [
    { path = "std::dbg",           reason = "debug artefact — remove before committing" },
    { path = "core::todo",         reason = "incomplete code must not land" },
    { path = "core::unimplemented", reason = "incomplete code must not land" },
    { path = "std::print",         reason = "direct console output; route diagnostics through structured runner output or a logger" },
    { path = "std::println",       reason = "direct console output; route diagnostics through structured runner output or a logger" },
    { path = "std::eprint",        reason = "direct console output; route diagnostics through structured runner output or a logger" },
    { path = "std::eprintln",      reason = "direct console output; route diagnostics through structured runner output or a logger" },
    { path = "core::panic",        reason = "panics; model the failure as a typed error or TestFailure instead" },
    { path = "core::assert",       reason = "panics; return Result and use strict_test_support::ensure" },
    { path = "core::assert_eq",    reason = "panics; use strict_test_support::ensure_eq or ensure(a == b, ..)" },
    { path = "core::assert_ne",    reason = "panics; use strict_test_support::ensure_ne or ensure(a != b, ..)" },
    { path = "core::debug_assert", reason = "panics in debug, silently dropped in release; model the invariant instead" },
    { path = "core::debug_assert_eq", reason = "panics in debug, silently dropped in release; use strict_test_support::ensure_eq" },
    { path = "core::debug_assert_ne", reason = "panics in debug, silently dropped in release; use strict_test_support::ensure_ne" },
    # Legacy property harness front doors. The native strict property runner
    # is `proptest::strict::ensure_property`.
    { path = "proptest::proptest",       reason = "panicking property harness; use proptest::strict::ensure_property" },
    { path = "proptest::prop_assert",    reason = "bypasses the TestFailure vocabulary; use strict_test_support::ensure inside a proptest::strict::ensure_property closure" },
    { path = "proptest::prop_assert_eq", reason = "bypasses the TestFailure vocabulary; use strict_test_support::ensure_eq inside a proptest::strict::ensure_property closure" },
    { path = "proptest::prop_assert_ne", reason = "bypasses the TestFailure vocabulary; use strict_test_support::ensure_ne inside a proptest::strict::ensure_property closure" },
    { path = "proptest::prop_assume",    reason = "rejection belongs in the strategy; use Strategy::prop_filter" },
]

# ── Disallowed methods (ad-hoc error construction + panicking std items) ────
disallowed-methods = [
    { path = "std::mem::forget",        reason = "leaks resources; use drop or ManuallyDrop" },
    { path = "std::process::exit",      reason = "bypasses destructors; return from main instead" },
    { path = "std::process::abort",     reason = "bypasses destructors" },
    { path = "std::env::set_var",       reason = "racy in multi-threaded programs" },
    { path = "std::env::remove_var",    reason = "racy in multi-threaded programs" },
    # NOTE: `std::io::Error::new` / `std::io::Error::other` are also banned
    # policy-wise (ad-hoc error construction; define a typed error instead),
    # but clippy cannot resolve those inherent-impl paths on current
    # toolchains ("does not refer to a reachable function"), so the ban is
    # enforced by source audit (`rg "std::io::Error::(new|other)"`) rather
    # than by a disallowed-methods entry.
    { path = "std::time::SystemTime::now", reason = "non-deterministic; inject the clock or derive time from the seeded RNG" },
    # ── Panicking slice methods (indexing_slicing only catches `[]`) ──
    { path = "slice::split_at",         reason = "panics if mid > len; use split_at_checked" },
    { path = "slice::split_at_mut",     reason = "panics if mid > len; use split_at_mut_checked" },
    { path = "slice::chunks",           reason = "panics if chunk size == 0; validate the size first" },
    { path = "slice::chunks_exact",     reason = "panics if chunk size == 0; validate the size first" },
    { path = "slice::rchunks",          reason = "panics if chunk size == 0; validate the size first" },
    { path = "slice::rchunks_exact",    reason = "panics if chunk size == 0; validate the size first" },
    { path = "slice::windows",          reason = "panics if size == 0; validate the size first" },
    { path = "slice::copy_from_slice",  reason = "panics on length mismatch; check lengths first" },
    { path = "slice::clone_from_slice", reason = "panics on length mismatch; check lengths first" },
    { path = "slice::rotate_left",      reason = "panics if mid > len; validate first" },
    { path = "slice::rotate_right",     reason = "panics if k > len; validate first" },
    { path = "slice::swap",             reason = "panics on out-of-bounds index; use get/get_mut + mem::swap" },
    # ── Panicking Vec methods ──
    { path = "std::vec::Vec::remove",      reason = "panics if index out of bounds; check len first" },
    { path = "std::vec::Vec::insert",      reason = "panics if index > len; check len first" },
    { path = "std::vec::Vec::swap_remove", reason = "panics if index out of bounds; check len first" },
    { path = "std::vec::Vec::split_off",   reason = "panics if at > len; check len first" },
    { path = "std::vec::Vec::drain",       reason = "panics if the range is out of bounds; validate the range" },
    # ── Panicking String methods (off a char boundary / out of bounds) ──
    { path = "std::string::String::remove",     reason = "panics off a char boundary; validate first" },
    { path = "std::string::String::insert",     reason = "panics off a char boundary; validate first" },
    { path = "std::string::String::insert_str", reason = "panics off a char boundary; validate first" },
    { path = "std::string::String::split_off",  reason = "panics off a char boundary; validate first" },
    { path = "std::string::String::drain",      reason = "panics off char boundaries; validate first" },
    { path = "std::string::String::truncate",   reason = "panics off a char boundary; validate first" },
    # ── Panicking str methods ──
    { path = "str::split_at",     reason = "panics off a char boundary / past end; use split_at_checked" },
    { path = "str::split_at_mut", reason = "panics off a char boundary / past end" },
    # ── Panicking Duration float constructors / scaling ──
    { path = "std::time::Duration::from_secs_f64", reason = "panics on negative/NaN/overflow; use try_from_secs_f64" },
    { path = "std::time::Duration::from_secs_f32", reason = "panics on negative/NaN/overflow; use try_from_secs_f32" },
    { path = "std::time::Duration::mul_f64",        reason = "panics on overflow / non-finite factor" },
    { path = "std::time::Duration::mul_f32",        reason = "panics on overflow / non-finite factor" },
    { path = "std::time::Duration::div_f64",        reason = "panics on overflow / non-finite divisor" },
    { path = "std::time::Duration::div_f32",        reason = "panics on overflow / non-finite divisor" },
    # ── Interior-mutability borrows that panic on a borrow conflict ──
    { path = "std::cell::RefCell::borrow",     reason = "panics on a borrow conflict; use try_borrow" },
    { path = "std::cell::RefCell::borrow_mut", reason = "panics on a borrow conflict; use try_borrow_mut" },
    # NOTE: map / slice / array `[]` indexing and `str` range slicing are
    # covered by `indexing_slicing` + `string_slice` lint levels in the
    # workspace lints table — no disallowed-methods entry works for the `[]`
    # operator (it does not catch the Index::index desugar).
]

# ── Disallowed types (poisoning-prone std locks) ────────────────────────────
disallowed-types = [
    { path = "std::sync::Mutex",   reason = "poisoning-prone lock; prefer parking_lot or redesign the shared state" },
    { path = "std::sync::RwLock",  reason = "poisoning-prone lock; prefer parking_lot or redesign the shared state" },
    { path = "std::sync::Condvar", reason = "poisoning-prone primitive; prefer parking_lot or redesign the signalling" },
]
