[workspace.metadata.config.layout]
schema-version = "0.1.0"
kind = "flat"

# ═════════════════════════════════════════════════════════════════════════════
# Lint policy — rustc
# ─────────────────────────────────────────────────────────────────────────────
# Shared workspace lint levels; members adopt them via `lints.workspace = true`.
# Levels are calibrated against this workspace: a lint is `deny` only where the
# whole opted tree actually holds under
# `cargo +nightly clippy --workspace --all-targets --all-features`, `warn`
# where documented legacy surfaces (the panicking macro facade, the runner's
# stderr diagnostics seam, upstream-derived internals) still carry the pattern.
# `priority = -1` = applied before individual lints, so specific overrides win.
# ═════════════════════════════════════════════════════════════════════════════

[workspace.lints.rust]
unsafe_code                             = "warn"

future_incompatible                     = { level = "deny", priority = -1 }
rust_2018_idioms                        = { level = "warn", priority = -1 }
rust_2021_compatibility                 = { level = "deny", priority = -1 }
rust_2024_compatibility                 = { level = "deny", priority = -1 }
nonstandard_style                       = { level = "deny", priority = -1 }
let_underscore                          = { level = "warn", priority = -1 }
unused                                  = { level = "warn", priority = -1 }
deprecated_safe                         = { level = "deny", priority = -1 }
keyword_idents                          = { level = "deny", priority = -1 }

missing_docs                            = "warn"
missing_debug_implementations           = "warn"
unreachable_pub                         = "warn"
trivial_casts                           = "warn"
trivial_numeric_casts                   = "warn"
unused_lifetimes                        = "deny"
unused_qualifications                   = "warn"
unused_import_braces                    = "deny"
unused_extern_crates                    = "warn"
unused_results                          = "warn"
unused_macro_rules                      = "warn"
single_use_lifetimes                    = "warn"
elided_lifetimes_in_paths               = "warn"
meta_variable_misuse                    = "warn"
non_ascii_idents                        = "deny"
noop_method_call                        = "deny"
macro_use_extern_crate                  = "warn"
absolute_paths_not_starting_with_crate  = "deny"
variant_size_differences                = "deny"
redundant_lifetimes                     = "deny"
refining_impl_trait_internal            = "deny"
refining_impl_trait_reachable           = "deny"
ambiguous_negative_literals             = "deny"
async_fn_in_trait                       = "allow"
missing_copy_implementations            = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links                  = "deny"
private_intra_doc_links                 = "deny"
missing_crate_level_docs                = "deny"
bare_urls                               = "deny"
unescaped_backticks                     = "deny"
invalid_rust_codeblocks                 = "deny"

[workspace.lints.clippy]
correctness = { level = "warn",  priority = -1 }
suspicious  = { level = "warn",  priority = -1 }
complexity  = { level = "warn",  priority = -1 }
perf        = { level = "warn",  priority = -1 }
style       = { level = "warn",  priority = -1 }
pedantic    = { level = "warn",  priority = -1 }
nursery     = { level = "warn",  priority = -1 }
cargo       = { level = "warn",  priority = -1 }
restriction = { level = "allow", priority = -1 }

as_conversions                           = "warn"
as_underscore                            = "deny"
as_ptr_cast_mut                          = "deny"
cast_lossless                            = "warn"
cast_possible_truncation                 = "warn"
cast_possible_wrap                       = "warn"
cast_precision_loss                      = "warn"
cast_sign_loss                           = "warn"
cast_ptr_alignment                       = "deny"
char_lit_as_u8                           = "deny"
fn_to_numeric_cast_any                   = "deny"
ptr_as_ptr                               = "deny"
borrow_as_ptr                            = "warn"
float_arithmetic                         = "warn"
float_cmp                                = "warn"
float_cmp_const                          = "warn"
lossy_float_literal                      = "deny"
integer_division                         = "warn"
integer_division_remainder_used          = "warn"
modulo_arithmetic                        = "warn"
arithmetic_side_effects                  = "warn"
invalid_upcast_comparisons               = "deny"
suspicious_xor_used_as_pow               = "deny"
unchecked_time_subtraction               = "deny"

mem_forget                               = "deny"
clone_on_ref_ptr                         = "warn"
