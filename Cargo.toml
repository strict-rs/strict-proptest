[workspace]
members = [
    "proptest",
    "proptest-derive",
    "proptest-derive-internal",
    "proptest-state-machine",
    "proptest-macro",
    "xtask",
]

resolver = "3"
exclude = ["proptest/test-persistence-location/*"]

[workspace.package]
license = "MIT OR Apache-2.0"
license-file = "LICENSE-APACHE or LICENSE-MIT"
repository = "https://github.com/strict-rs/strict-proptest"
homepage = "https://proptest-rs.github.io/proptest/proptest/"
documentation = "https://docs.rs/proptest/latest/proptest/"
categories = ["development-tools::testing"]
edition = "2024"
rust-version = "1.97"
version = "1.2.0"
authors = ["The Proptest Developers", "Takumi Shimada <hello@takumi.earth>"]
publish = false

[workspace.dependencies]

# Internal deps
proptest = { version = "1.2.0", path = "proptest" }
proptest-macro = { version = "1.2.0", path = "proptest-macro" }
proptest-derive-internal = { version = "1.2.0", path = "proptest-derive-internal" }

# External deps
bit-set = "0.11.0"
bit-vec = "0.10.0"
bitflags = "2.13"
compiletest_rs = "0.11"
convert_case = "0.11"
criterion = "0.8"
getrandom = { version = "0.4.3", default-features = false }
insta = "1"
message-io = { version = "0.19.0", default-features = false }
num-traits = { version = "0.2.19", default-features = false }
prettyplease = "0.2"
quote = "1.0"
rand = { version = "0.10", default-features = false }
rand_chacha = { version = "0.10", default-features = false }
rand_xorshift = "0.5"
regex = "1.13"
regex-syntax = "0.8"
rusty-fork = { version = "0.3.1", default-features = false }
tempfile = "3.27"
unarray = "0.1.4"

# strict-* ecosystem deps (comment out if unused, do not remove)
agents-md = { version = "0.1.0", git = "ssh://git@github.com/earthlings-dev/agents-md-rs.git", branch = "main" }
bpaf = { git = "ssh://git@github.com/strict-rs/strict-bpaf.git", branch = "sync", version = "0.10", default-features = false }
strict-xtask-core = { version = "0.1.0", git = "ssh://git@github.com/earthlings-dev/strict-xtask-core-rs.git", branch = "main" }
strict-xtask-cargo = { version = "0.1.0", git = "ssh://git@github.com/earthlings-dev/strict-xtask-cargo-rs.git", branch = "main" }
strict-xtask-agents-md = { version = "0.1.0", git = "ssh://git@github.com/earthlings-dev/strict-xtask-agents-md-rs.git", branch = "main" }
mutant_fleet = { version = "0.1.0", git = "ssh://git@github.com/earthlings-dev/rust-mutant-fleet.git", branch = "main" }
strict-test-support = { version = "0.1.0", git = "ssh://git@github.com/earthlings-dev/strict-test-support-rs.git", branch = "main" }
trybuild = { git = "ssh://git@github.com/strict-rs/strict-trybuild.git", branch = "strict", version = "1" }
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
serde_json = "1"
cargo_metadata = "0.23"
ignore = "0.4"
globset = "0.4"
toml = "1.1"
toml_edit = "0.25"
anstyle = "1"
snapbox = { version = "1.2", default-features = false, features = ["diff"] }
parking_lot = "0.12"

